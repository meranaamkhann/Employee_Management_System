spring:
  application:
    name: hr-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 5433, matching docker-compose.yml's host port mapping for postgres
    # (remapped from the default 5432 to avoid clashing with a native
    # Postgres install on the host). Only relevant when running the
    # backend directly via `mvn spring-boot:run` against Dockerized
    # Postgres — when the backend itself runs in Docker (docker compose
    # up), it connects via DB_URL set in docker-compose.yml instead,
    # which correctly uses the internal port 5432 over the container
    # network and ignores this default entirely.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hr_platform}
    username: ${DB_USERNAME:hr_platform}
    password: ${DB_PASSWORD:hr_platform}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars-long}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.hrplatform: DEBUG
    org.hibernate.SQL: WARN
