version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_platform
      POSTGRES_USER: hr_platform
      POSTGRES_PASSWORD: hr_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/hr_platform
      DB_USERNAME: hr_platform
      DB_PASSWORD: hr_platform
      JWT_SECRET: ${JWT_SECRET:?set a long random secret in your .env file}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hrplatform.local}
      APP_SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set an admin password in your .env file}
      APP_SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
