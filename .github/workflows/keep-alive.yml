name: Keep Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 minutes — under Render free tier's 15-minute spin-down
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf "${{ secrets.BACKEND_HEALTH_URL }}/actuator/health" || echo "Ping failed, service may be cold-starting"