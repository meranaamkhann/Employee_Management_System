name: Deploy

on:
  workflow_run:
    workflows: ['CI/CD — Employee Management System']
    types: [completed]
    branches: [main]

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"